name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Find Project Root and Build
        run: |
          # Procura automaticamente onde está o pubspec.yaml
          PROJECT_DIR=$(find . -name "pubspec.yaml" -maxdepth 3 -exec dirname {} \; | head -n 1)
          echo "Projeto Flutter encontrado em: ./$PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          flutter pub get
          yes | flutter doctor --android-licenses || true
          flutter build apk --release --no-pub
          
          # Prepara o APK para o upload
          mkdir -p ../../output_apk
          cp build/app/outputs/flutter-apk/app-release.apk ../../output_apk/hyper-tv-stream.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyper-tv-stream-release
          path: output_apk/hyper-tv-stream.apk
