name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          # Verifica se o pubspec.yaml está na raiz ou numa subpasta
          if [ -f "pubspec.yaml" ]; then
            echo "Projeto encontrado na raiz."
          else
            # Procura a pasta que contém o pubspec.yaml
            SUBDIR=$(find . -name "pubspec.yaml" -maxdepth 2 -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              echo "Movendo para a pasta: $SUBDIR"
              cd "$SUBDIR"
            else
              echo "Erro: pubspec.yaml não encontrado!"
              exit 1
            fi
          }

          flutter pub get
          yes | flutter doctor --android-licenses || true
          flutter build apk --release --no-pub
          
          # Prepara o APK para o upload
          mkdir -p build_output
          cp build/app/outputs/flutter-apk/app-release.apk build_output/hyper-tv-stream.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyper-tv-stream-release
          path: build_output/hyper-tv-stream.apk
